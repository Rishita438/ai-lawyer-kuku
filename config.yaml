# Which AI model the app uses. To swap models, change these lines - no code changes.
# Any provider with an OpenAI-compatible API works (Gemini, Groq, OpenAI, Together, ...).

provider: gemini
base_url: https://generativelanguage.googleapis.com/v1beta/openai/
model:  gemini-3.5-flash-lite        # gemini-2.5-flash was shut down 16-Oct-2026 (FAILURES F14).
                                 # Check current names with: py scripts\test_llm.py --list
api_key_env: GEMINI_API_KEY      # name of the variable in .env (never put the key itself here)
timeout_seconds: 30              # stop waiting for a reply after this long
temperature: 0.2                # low = more consistent, less "creative" (we want boring and accurate)

# Optional backup if the main model fails (rate limit, outage). Leave blank to disable.
fallback:
  base_url: https://api.groq.com/openai/v1
  model: openai/gpt-oss-120b
  api_key_env: GROQ_API_KEY
