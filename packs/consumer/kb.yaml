entries:
  - id: CPA2019-S2-7
    type: law
    act: Consumer Protection Act, 2019
    section: "2(7)"
    title: Who is a "consumer"
    plain_summary: >
      You are a consumer if you buy goods or hire a service for a price that
      is paid, promised, partly paid or payable in instalments. A person who
      uses the goods or benefits from the service with the buyer's approval
      also counts. Buying goods for resale or for any commercial purpose, or
      hiring a service for a commercial purpose, does not count. Goods bought
      and used exclusively to earn your livelihood through self-employment are
      not treated as commercial purpose. Online and offline transactions,
      teleshopping, direct selling and multi-level marketing are all covered.
    applies_when: First check in every consumer case - is this person a consumer?
    does_not_apply_when: Business-to-business purchases for resale or commercial use.
    lay_questions: ["Can I go to consumer court?", "kya main consumer hoon?"]
    source_name: India Code - Consumer Protection Act, 2019
    source_url: https://indiacode.gov.in/act/1b6c1754-47b1-411e-9607-1712a9caf368/sections
    jurisdiction: central
    status: verified
    ai_confidence: high
    verified_by: Rishita
    last_verified: 2026-11-19

  - id: CPA2019-S2-10
    type: law
    act: Consumer Protection Act, 2019
    section: "2(10)"
    title: What is a "defect" (goods)
    plain_summary: >
      A defect is any fault, imperfection or shortcoming in the quality,
      quantity, potency, purity or standard of goods. The standard can be one
      required by law, by a contract (express or implied), or one claimed by
      the trader or seller.
    applies_when: The product itself is faulty or not as promised.
    does_not_apply_when: The problem is with a service (see deficiency).
    lay_questions: ["The phone stopped working in a week", "product kharab nikla"]
    source_name: India Code - Consumer Protection Act, 2019
    source_url: https://indiacode.gov.in/act/1b6c1754-47b1-411e-9607-1712a9caf368/sections
    jurisdiction: central
    status: verified
    ai_confidence: high
    verified_by: Rishita
    last_verified: 2026-11-19

  - id: CPA2019-S2-11
    type: law
    act: Consumer Protection Act, 2019
    section: "2(11)"
    title: What is a "deficiency" (services)
    plain_summary: >
      A deficiency is any fault, imperfection, shortcoming or inadequacy in the
      quality, nature and manner of performance of a service, which is required
      by law or has been undertaken under a contract or otherwise. It includes
      an act or omission by the service provider that causes loss or injury to
      the consumer, and deliberately withholding relevant information from the
      consumer.
    applies_when: A service (delivery, repair, refund processing, airline, bank etc.) was not delivered properly.
    does_not_apply_when: Free services, or services under a contract of personal service (employment).
    lay_questions: ["Refund promised but never came", "service theek se nahi di"]
    source_name: India Code - Consumer Protection Act, 2019
    source_url: https://indiacode.gov.in/act/1b6c1754-47b1-411e-9607-1712a9caf368/sections   
    jurisdiction: central
    status: verified
    ai_confidence: high
    verified_by: Rishita
    last_verified: 2026-11-19

  - id: CPA2019-S2-47
    type: law
    act: Consumer Protection Act, 2019
    section: "2(47)"
    title: What is an "unfair trade practice"
    plain_summary: >
      An unfair trade practice is any unfair method or deceptive practice used
      to promote the sale, use or supply of goods or services. It includes false
      claims about quality or standard, misleading ads and fake bargain prices,
      giving false warranties, not giving a bill or receipt, and selling spurious
      goods. It also includes refusing to take back defective goods, or to
      withdraw deficient services and refund the money paid, within the period
      stated on the bill or receipt, or within thirty days if none is stated.
    applies_when: Seller misled the buyer, or refused a return/refund it had promised.
    does_not_apply_when: No unfair method or deceptive practice, and no refusal of take-back or refund as described above.
    lay_questions: ["They refused to take it back", "ad mein kuch aur bataya tha"]
    source_name: India Code - Consumer Protection Act, 2019
    source_url: https://indiacode.gov.in/act/1b6c1754-47b1-411e-9607-1712a9caf368/sections   
    jurisdiction: central
    status: verified
    ai_confidence: high
    verified_by: Rishita
    last_verified: 2026-11-19
    

  - id: CPA2019-S34
    type: law
    act: Consumer Protection Act, 2019
    section: "34"
    title: District Commission - which one you can file in
    plain_summary: >
      A complaint goes to the District Commission when the value of the goods or
      services paid as consideration is within the limit set for it (the limit
      has been revised by Central Government rules). You can file where the
      other party ordinarily lives, carries on business or has a branch office,
      where the cause of action arose wholly or partly, or where you yourself
      live or personally work for gain. In some cases, filing where the other
      party only voluntarily resides or works needs the Commission's permission.
    applies_when: Deciding where to file a consumer complaint.
    does_not_apply_when: Value above the District limit (see jurisdiction rules).
    lay_questions: ["Where do I file?", "complaint kahan karun?"]
    source_name: India Code - Consumer Protection Act, 2019
    source_url: https://indiacode.gov.in/act/1b6c1754-47b1-411e-9607-1712a9caf368/sections  
    jurisdiction: central
    status: verified
    ai_confidence: high
    verified_by: Rishita
    last_verified: 2026-11-19

  - id: CPA2019-S35
    type: law
    act: Consumer Protection Act, 2019
    section: "35"
    title: How a complaint is filed
    plain_summary: >
      A complaint about goods sold or delivered, or a service provided (or agreed
      to be), can be filed with the District Commission by the consumer, a
      recognised consumer association, one or more consumers with the same
      interest (with the Commission's permission), or the Central or State
      Government. It can be filed electronically, and must be accompanied by the
      prescribed fee.
    applies_when: explaining how to file
    does_not_apply_when: n/a
    lay_questions: ["How do i file a consumer complaint?", "complaint kaise file karun?"]
    source_name: India Code - Consumer Protection Act, 2019
    source_url: https://indiacode.gov.in/act/1b6c1754-47b1-411e-9607-1712a9caf368/sections
    jurisdiction: central
    status: verified
    ai_confidence: medium
    verified_by: Rishita
    last_verified: 2026-11-19

  - id: CPA2019-S39
    type: law
    act: Consumer Protection Act, 2019
    section: "39"
    title: What the Commission can order
    plain_summary: >
      If the District Commission finds the complaint proved, it can order the
      opposite party to do one or more things, such as: remove the defect or
      deficiency, replace the goods, return the price (with interest as decided),
      pay compensation for loss or injury caused by negligence (it can also
      award punitive damages), stop an unfair trade practice or misleading
      advertisement, and pay costs. Which of these applies depends on the case;
      nothing is guaranteed.
    does_not_apply_when: n/a (never promise a specific outcome)
    lay_questions: ["What can I get?", "kya milega?"]
    source_name: India Code - Consumer Protection Act, 2019
    source_url: https://indiacode.gov.in/act/1b6c1754-47b1-411e-9607-1712a9caf368/sections
    jurisdiction: central
    status: verified
    ai_confidence: high
    verified_by: Rishita
    last_verified: 2026-11-19

  - id: CPA2019-S69
    type: law
    act: Consumer Protection Act, 2019
    section: "69"
    title: Time limit for filing a complaint
    plain_summary: >
      A consumer complaint must be filed within 2 years from the date the cause
      of action arose, otherwise the Commission will not admit it. A late
      complaint can still be entertained if the complainant satisfies the
      Commission that there was sufficient cause for the delay, and the
      Commission records its reasons for allowing it.
    applies_when: Deciding whether a consumer complaint may be too late.
    does_not_apply_when: Not a consumer dispute.
    lay_questions: ["Is it too late to complain?", "kitne time tak complaint kar sakte hain?"]
    source_name: India Code - Consumer Protection Act, 2019
    source_url: https://indiacode.gov.in/act/1b6c1754-47b1-411e-9607-1712a9caf368/sections   # TODO: exact Act page
    jurisdiction: central
    status: verified
    ai_confidence: high
    verified_by: Rishita
    last_verified: 2026-11-19

  - id: CPR2021-PECUNIARY
    type: law
    act: Consumer Protection (Jurisdiction of the District Commission, the State Commission and the 
        National Commission) Rules, 2021
    section: "Rules 3-5"
    title: Money limits - which Commission
    plain_summary: >
      District Commission: complaints where the value of goods or services paid
      as consideration is up to Rs 50 lakh. State Commission: above Rs 50 lakh
      and up to Rs 2 crore. National Commission: above Rs 2 crore. These limits
      are subject to the other provisions of the Act.
    applies_when: Choosing the right Commission (used by the forum calculator).
    does_not_apply_when: n/a
    lay_questions: ["Which consumer court?", "kaunsa forum?"]
    source_name: Gazette of India, G.S.R. 912(E), 30 Dec 2021 (Ministry of Consumer Affairs)
    source_url: https://www.pib.gov.in/PressReleasePage.aspx?PRID=1786342
    jurisdiction: central
    status: verified
    ai_confidence: medium
    verified_by: Rishita
    last_verified: 2026-11-19
    notes: "Verified 19-11-2026 on PIB release PRID 1786342: limits and Rules 3-5. No amending rules found."

  - id: CPR2020-FEES
    type: law
    act: Consumer Protection (Consumer Disputes Redressal Commissions) Rules, 2020
    section: "Rule 7 (fee table)"
    title: Fee for filing a consumer complaint
    plain_summary: >
      The fee depends on the value of goods or services paid as consideration:
      up to Rs 5 lakh - nil; above 5 lakh to 10 lakh - Rs 200; above 10 lakh to
      20 lakh - Rs 400; above 20 lakh to 50 lakh - Rs 1000; above 50 lakh to 1
      crore - Rs 2000; above 1 crore to 2 crore - Rs 2500; above 2 crore to 4
      crore - Rs 3000; above 4 crore to 6 crore - Rs 4000; above 6 crore to 8
      crore - Rs 5000; above 8 crore to 10 crore - Rs 6000; above 10 crore -
      Rs 7500.
    applies_when: User asks what it costs to file a consumer complaint.
    does_not_apply_when: n/a
    lay_questions: ["How much fee to file a consumer complaint?", "consumer complaint ki fees kitni hai?"]
    source_name: Gazette of India, G.S.R. 606(E), 17 Aug 2023
    source_url: https://egazette.gov.in/WriteReadData/2023/248158.pdf
    jurisdiction: central
    status: verified
    ai_confidence: low
    verified_by: Rishita
    last_verified: 2026-11-19
    notes: "Verified against the Gazette PDF. Not checked for amendments after Aug 2023."

  - id: ECOM2020-R4-5
    type: law
    act: Consumer Protection (E-Commerce) Rules, 2020
    section: "Rule 4(4)-(5)"
    title: E-commerce grievance officer
    plain_summary: >
      Every e-commerce entity (the operator of an online platform, including
      marketplace and inventory-model platforms, but not a seller listing goods
      on a marketplace) must set up an adequate grievance redressal mechanism,
      appoint a grievance officer, and display the officer's name, contact
      details and designation on its platform. The officer must acknowledge a
      consumer complaint within 48 hours and redress it within one month of
      receiving it.
    applies_when: A purchase was made over a digital or electronic network (website or app) and the platform is not responding to a complaint.
    does_not_apply_when: The purchase was not made over a digital or electronic network, or the activity is by an individual in a personal capacity, not a regular or commercial one.
    lay_questions: ["Amazon is not responding", "online order ka refund nahi aaya"]
    source_name: Gazette of India, G.S.R. 462(E), 23 July 2020 (Dept. of Consumer Affairs)
    source_url: https://egazette.gov.in/WriteReadData/2020/220661.pdf
    jurisdiction: central
    status: verified
    ai_confidence: high
    verified_by: Rishita
    last_verified: 2026-11-19
    notes: "Verified against Gazette G.S.R. 462(E). Not checked for amendments after 2020."

  - id: PROC-NCH
    type: procedure
    title: National Consumer Helpline (pre-litigation step)
    plain_summary: >
      Before going to a Commission, you can register a grievance with the
      National Consumer Helpline (NCH), which is a pre-litigation step. Call
      1915 or 1800 11 4000 (daily except national holidays, 8 AM to 8 PM), send
      an SMS to 8800001915, or use the web portal, WhatsApp, the NCH app or the
      UMANG app. NCH makes efforts to get the grievance redressed by taking it
      up with the authorities concerned, but this is not guaranteed. If it is
      not resolved to your satisfaction, you can approach the appropriate
      consumer Commission.
    applies_when: A consumer has a grievance and wants a pre-litigation step before approaching a Commission.
    does_not_apply_when: Time limit is close - do not wait on the helpline; file the complaint.
    lay_questions: ["Is there a helpline?", "pehle kya karun?"]
    source_name: National Consumer Helpline (consumerhelpline.gov.in), Contact page and FAQ
    source_url: https://consumerhelpline.gov.in/
    jurisdiction: central
    status: verified
    ai_confidence: high
    verified_by: Rishita
    last_verified: 2026-11-19

  - id: PROC-EJAGRITI
    type: procedure
    title: File online on e-Jagriti
    plain_summary: >
      Consumer complaints can be filed online on the e-Jagriti portal of the
      Department of Consumer Affairs. e-Jagriti was launched on 1 January 2025
      and unified earlier systems, including e-Daakhil, into one platform.
    applies_when: User decides to file a formal complaint.
    does_not_apply_when: n/a
    lay_questions: ["How do I file online?", "online complaint kaise karein?"]
    source_name: e-Jagriti (Department of Consumer Affairs)
    source_url: https://e-jagriti.gov.in/
    jurisdiction: central
    status: verified
    ai_confidence: high
    verified_by: Rishita
    last_verified: 2026-11-19
    notes: "Launch date and e-Daakhil integration confirmed via PIB press releases (PRID 2269994, 2157241). Portal header shows Dept of Consumer Affairs. Registration steps not verified."
